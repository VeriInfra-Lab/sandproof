[package]
name = "sandproof-controller-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sandbox-controller-core = { path = "../controller-core", features = ["serde"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
sandproof-protocol = { path = "../sandbox-protocol" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.142"
sha2 = "=0.10.9"
tokio = { version = "=1.49.0", features = ["sync"] }

[dev-dependencies]
tempfile = "=3.23.0"
tokio = { version = "=1.49.0", features = ["rt", "macros", "time"] }

[lints]
workspace = true
