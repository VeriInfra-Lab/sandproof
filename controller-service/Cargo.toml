[package]
name = "sandproof-controller-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Compile host artifact capabilities independently of the SQLite coordinator.
# This is a capability boundary, not an alternative runtime or storage mode.
host-artifacts = []
# The host uses the durable coordinator; pure API/center contracts do not link SQLite.
default = ["durable"]
durable = ["host-artifacts", "dep:rusqlite", "dep:tokio", "dep:getrandom"]
# Local bounded diagnostics only; not enabled by the deployed service.
contention-diagnostics = ["durable"]

[dependencies]
sandbox-controller-core = { path = "../controller-core", features = ["serde"] }
rusqlite = { version = "=0.40.2", features = ["bundled"], optional = true }
sandproof-protocol = { path = "../sandbox-protocol" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.142"
sha2 = "=0.10.9"
tokio = { version = "=1.49.0", features = ["sync"], optional = true }

getrandom = { version = "=0.3.4", optional = true }

[dev-dependencies]
tempfile = "=3.23.0"
tokio = { version = "=1.49.0", features = ["rt", "macros", "time"] }

[lints]
workspace = true
