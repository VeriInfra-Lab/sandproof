# Illustrative inputs, not production defaults. Missing operator ACL material
# must prevent startup; never substitute an example/public password.
bind 127.0.0.1
port 6379
protected-mode yes
daemonize no
supervised no
aclfile /var/lib/sandproof-services/redis/control/users.acl
dir /var/lib/sandproof-services/redis/data
appendonly yes
appendfsync always
no-appendfsync-on-rewrite no
aof-load-truncated no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 16mb
maxmemory 134217728
maxmemory-policy noeviction
set-proc-title no
save ""
loglevel warning
logfile ""
