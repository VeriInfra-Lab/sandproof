[package]
name = "sandproof-parser-binding-check"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "lib.rs"

[dependencies]
sandproof-protocol = { path = "../../../../sandbox-protocol" }
serde = { version = "=1.0.228", features = ["alloc"] }
serde_core = { version = "=1.0.228", features = ["alloc"] }
serde_json = { version = "=1.0.142", features = ["raw_value"] }
