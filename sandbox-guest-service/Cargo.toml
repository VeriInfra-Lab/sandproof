[package]
name = "sandproof-guest-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
base64 = "=0.22.1"
sandproof-guest-core = { path = "../sandbox-guest-core" }
sandproof-guest-runtime = { path = "../sandbox-guest-runtime" }
axum = { version = "=0.8.9", features = ["tokio", "http1"] }
bytes = "=1.12.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.142"
sha2 = "=0.10.9"
subtle = "=2.6.1"
tokio = { version = "=1.49.0", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
zeroize = "=1.9.1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
tokio = { version = "=1.49.0", features = ["test-util", "io-util"] }
tower = { version = "=0.5.2", features = ["util"] }

[lints]
workspace = true
