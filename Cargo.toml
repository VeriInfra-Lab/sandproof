[workspace]
members = ["controller-core", "sandbox-protocol", "controller-service", "sandbox-runtime", "sandbox-node", "sandbox-api", "sandbox-server"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true
