[package]
name = "sandproof-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sandbox-controller-core = { path = "../controller-core", features = ["serde"] }
sandproof-controller-service = { path = "../controller-service" }
sandproof-protocol = { path = "../sandbox-protocol" }
sandbox-runtime = { path = "../sandbox-runtime" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.142"
tempfile = "=3.23.0"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", features = ["process", "fs"] }

[lints]
workspace = true
