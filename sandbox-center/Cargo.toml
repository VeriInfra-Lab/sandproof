[package]
name = "sandproof-center"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sandproof-protocol = { path = "../sandbox-protocol" }
serde_json = "=1.0.142"

[target.'cfg(unix)'.dependencies]
sandproof-center-core = { path = "../sandbox-center-core" }
sandproof-center-store = { path = "../sandbox-center-store" }
sandproof-center-service = { path = "../sandbox-center-service" }
sandproof-api = { path = "../sandbox-api", default-features = false }
sandproof-controller-service = { path = "../controller-service", default-features = false, features = ["host-artifacts"] }
sandproof-data-transport = { path = "../sandbox-data-transport" }
sandproof-internal = { path = "../sandbox-internal" }
axum = { version = "=0.8.9", features = ["tokio", "http1"] }
hyper = { version = "=1.11.1", features = ["http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
rustix = { version = "=1.1.5", features = ["process"] }
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
tokio = { version = "=1.49.0", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util", "signal"] }

[lints]
workspace = true

[target.'cfg(unix)'.dev-dependencies]
redis = { version = "=1.7.1", default-features = false }
tempfile = "=3.23.0"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
tower = { version = "=0.5.2", features = ["util"] }
