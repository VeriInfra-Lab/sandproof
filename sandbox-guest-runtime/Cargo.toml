[package]
name = "sandproof-guest-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
sandproof-guest-core = { path = "../sandbox-guest-core" }
rustix = { version = "=1.1.5", features = ["process", "net"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.142"
tempfile = "=3.23.0"
tokio = { version = "=1.49.0", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time"] }

[[bin]]
name = "sandproof-guest-worker"
path = "src/main.rs"

[lints]
workspace = true
