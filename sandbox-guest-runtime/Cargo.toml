[package]
name = "sandproof-guest-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
sdk-contract-tests = []

[target.'cfg(target_os = "linux")'.dependencies]
base64 = "=0.22.1"
sandproof-guest-core = { path = "../sandbox-guest-core" }
rustix = { version = "=1.1.5", features = ["process", "net"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.142"
tempfile = "=3.23.0"
tokio = { version = "=1.49.0", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
axum = { version = "=0.8.9", features = ["tokio", "http1"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }

[[bin]]
name = "sandproof-guest-worker"
path = "src/main.rs"

[lints]
workspace = true
