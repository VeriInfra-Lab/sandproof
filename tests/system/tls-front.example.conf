# Standalone Nginx example, not an installed/default production service.
# Replace domain, TLS paths, listener and fixed loopback upstream before nginx -t.
# Values are an initial finite envelope, not a throughput recommendation.
worker_processes 1;
pid /run/sandproof-front.pid;
error_log stderr warn;
events { worker_connections 512; }
http {
    access_log off; # Do not log bearer headers or user URLs/content.
    limit_conn_zone $server_name zone=service:1m;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 8k;
    client_header_timeout 10s;
    client_body_timeout 30s; # Idle gap, not an absolute total-upload deadline.
    keepalive_timeout 15s;
    keepalive_requests 100;
    send_timeout 30s;
    server {
        listen 443 ssl;
        server_name sandbox.example.invalid *.sandbox.example.invalid;
        ssl_certificate /etc/sandproof/tls/cert.pem;
        ssl_certificate_key /etc/sandproof/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_handshake_timeout 10s;
        limit_conn service 128;
        limit_conn_status 429;
        error_page 429 = @overloaded;
        client_max_body_size 512m; # Must fit actual deployed transfer budgets.
        location / {
            proxy_pass http://127.0.0.1:8080; # Never derived from client inputs.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            # Idle command streams can be quiet. Align this with the maximum
            # supported request/lifetime; HTTP timeout still means unknown.
            proxy_read_timeout 86400s;
            proxy_next_upstream off; # Never replay accepted physical operations.
        }
        location @overloaded {
            default_type application/json;
            return 429 '{"code":429,"message":"Too Many Requests"}';
        }
    }
}
