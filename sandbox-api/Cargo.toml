[package]
name = "sandproof-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "=0.22.1"
percent-encoding = "=2.3.2"
sandbox-controller-core = { path = "../controller-core", features = ["serde"] }
sandproof-controller-service = { path = "../controller-service" }
sandproof-protocol = { path = "../sandbox-protocol" }
axum = { version = "=0.8.9", features = ["json", "tokio", "http1"] }
getrandom = "=0.3.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.142"
time = { version = "=0.3.44", features = ["formatting", "parsing"] }
tokio = { version = "=1.49.0", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[dev-dependencies]
sha2 = "=0.10.9"
rusqlite = "=0.40.2"
tempfile = "=3.23.0"
tower = { version = "=0.5.2", features = ["util"] }

[lints]
workspace = true
