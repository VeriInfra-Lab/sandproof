[package]
name = "sandproof-internal"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "=0.8.9", features = ["tokio", "http1"] }
sandproof-data-transport = { path = "../sandbox-data-transport" }
sandproof-protocol = { path = "../sandbox-protocol" }
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["client", "server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
serde_json = "=1.0.142"
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
tokio = { version = "=1.49.0", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }

[dev-dependencies]
tempfile = "=3.23.0"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
tokio = { version = "=1.49.0", features = ["test-util"] }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }
