[package]
name = "sandproof-data-transport"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sandproof-protocol = { path = "../sandbox-protocol" }
sandproof-stream-codec = { path = "../sandbox-stream-codec" }
percent-encoding = "=2.3.2"
axum = { version = "=0.8.9", features = ["tokio", "http1"] }
hyper = { version = "=1.11.1", features = ["client", "server", "http1"] }
http-body-util = "=0.1.5"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
tokio = { version = "=1.49.0", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }

[dev-dependencies]
hyper-util = { version = "=0.1.21", features = ["tokio"] }
tokio = { version = "=1.49.0", features = ["test-util"] }

[lints]
workspace = true
