name: V3 diagnostic CAS storage comparison

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: function-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-contract:
    runs-on: [self-hosted, Linux, X64, sandproof-ci-sdk]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compare exact center fixture on guest ext4 and XFS
        run: bash diagnostics/probe-ci-cas-storage.sh
