name: Function CI

on:
  pull_request:
    # Becoming ready for review does not change code, title or target. Draft PRs
    # already run the same checks; avoid cancelling/restarting them on readiness.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, test]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: function-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdk-contract:
    runs-on: [self-hosted, Linux, X64, sandproof-ci-sdk]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check pinned E2B SDK against loopback responses
        # No E2B cloud credentials, VM, or privileged runner are used.
        run: |
          python3 -m venv "$RUNNER_TEMP/uv-bootstrap"
          "$RUNNER_TEMP/uv-bootstrap/bin/python" -m pip install --disable-pip-version-check uv==0.11.31
          mkdir "$RUNNER_TEMP/ci-git"
          ln -s "$GITHUB_WORKSPACE/tools/ci_git.py" "$RUNNER_TEMP/ci-git/git"
          CI_GIT_LOCK="$GITHUB_WORKSPACE/tests/compat/uv.lock" \
            PATH="$RUNNER_TEMP/ci-git:$RUNNER_TEMP/uv-bootstrap/bin:$PATH" bash scripts/check-compat.sh

  harbor-inputs:
    runs-on: [self-hosted, Linux, X64, sandproof-ci-harbor]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check joint Harbor and E2B SDK installation
        # Imports and loopback contracts only; no task execution or cloud keys.
        run: |
          python3 -m venv "$RUNNER_TEMP/uv-bootstrap"
          "$RUNNER_TEMP/uv-bootstrap/bin/python" -m pip install --disable-pip-version-check uv==0.11.31
          mkdir "$RUNNER_TEMP/ci-git"
          ln -s "$GITHUB_WORKSPACE/tools/ci_git.py" "$RUNNER_TEMP/ci-git/git"
          CI_GIT_LOCK="$GITHUB_WORKSPACE/benchmarks/uv.lock" \
            PATH="$RUNNER_TEMP/ci-git:$RUNNER_TEMP/uv-bootstrap/bin:$PATH" bash scripts/check-bench.sh

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Linux, X64, sandproof-ci-title]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check PR title
        # Read untrusted title as JSON data, never interpolate it into shell code.
        run: python3 tools/check_commit_subject.py --event "$GITHUB_EVENT_PATH"

  pr-policy:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Linux, X64, sandproof-ci-policy]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check branch name and PR target
        run: python3 tools/check_pr_policy.py --event "$GITHUB_EVENT_PATH"
