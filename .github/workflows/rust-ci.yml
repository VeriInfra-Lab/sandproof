name: Rust CI

# Owner decision: developers run the full local checks; do not run this on PRs.
on:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: [self-hosted, Linux, X64, sandproof-ci-rust]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check pinned Rust workspace
        # The full workspace includes real Redis-backed component contracts.
        # Missing sealed material must fail before the original check entry.
        run: |
          redis_server="$(python3 tools/ci_redis.py check)"
          export SANDPROOF_REDIS_SERVER="$redis_server"
          export CARGO_NET_OFFLINE=true
          bash scripts/check-function.sh
